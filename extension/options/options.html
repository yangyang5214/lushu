<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>路书助手 · 设置</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="head">
        <h1>路书助手 · 设置</h1>
        <p class="muted">
          所有配置只保存在本机浏览器（chrome.storage.local），不会上传。
          需要 AI 处理的步骤都由你自己的 DeepSeek Key 完成。
        </p>
      </header>

      <section class="card">
        <h2>DeepSeek</h2>
        <label class="field">
          <span>API Key</span>
          <input id="deepseekKey" type="password" placeholder="sk-..." autocomplete="off" />
          <small>在 platform.deepseek.com 创建。仅本机保存。</small>
        </label>
        <div class="grid">
          <label class="field">
            <span>Base URL</span>
            <input id="deepseekBase" type="text" placeholder="https://api.deepseek.com" />
          </label>
          <label class="field">
            <span>模型</span>
            <input id="deepseekModel" type="text" placeholder="deepseek-chat" />
          </label>
        </div>
        <div class="actions">
          <button id="testAi" class="btn">测试 DeepSeek 连接</button>
          <span id="aiResult" class="result"></span>
        </div>
      </section>

      <section class="card">
        <h2>小红书（问点点）</h2>
        <label class="field">
          <span>生成方式</span>
          <select id="sourceMode">
            <option value="xhs">小红书问点点，再提取地点</option>
            <option value="deepseek">DeepSeek 按路书名直接生成</option>
          </select>
        </label>
        <p class="muted">
          插件会打开小红书首页，把关键词真正写入搜索框，再点下拉里出现的「问点点」。
          搜索框写不进去时会改走搜索结果页再点。需要浏览器里已登录小红书。
        </p>
        <label class="field">
          <span>首页地址</span>
          <input id="xhsHomeUrl" type="text" />
        </label>
        <div class="grid">
          <label class="field">
            <span>等回答超时（毫秒）</span>
            <input id="xhsTimeoutMs" type="number" min="10000" step="5000" />
          </label>
          <label class="field">
            <span>等「问点点」入口（毫秒）</span>
            <input id="dianWaitMs" type="number" min="2000" step="1000" />
          </label>
        </div>
        <div class="checks">
          <label><input id="xhsOpenActive" type="checkbox" /> 抓取时把小红书标签页切到前台（输入/点击需要焦点）</label>
          <label><input id="xhsKeepTab" type="checkbox" /> 抓完保留标签页（调试用）</label>
        </div>

        <details>
          <summary>高级：页面选择器（小红书改版后可在这里修）</summary>
          <label class="field">
            <span>首页搜索框（逗号分隔）</span>
            <input id="inputSelectors" type="text" />
          </label>
          <label class="field">
            <span>「问点点」入口（逗号分隔，留空则按文字自动找）</span>
            <input id="dianEntrySelectors" type="text" />
          </label>
          <label class="field">
            <span>补发问题时的发送按钮（逗号分隔）</span>
            <input id="sendSelectors" type="text" />
          </label>
          <label class="field">
            <span>回答容器（逗号分隔）</span>
            <input id="answerSelectors" type="text" />
          </label>
        </details>
      </section>

      <section class="card">
        <h2>写入路书</h2>
        <div class="grid">
          <label class="field">
            <span>写入路书可见性</span>
            <select id="visibility">
              <option value="private">私密</option>
              <option value="public">公开</option>
            </select>
          </label>
          <label class="field">
            <span>最多地点数</span>
            <input id="maxPlaces" type="number" min="3" max="60" />
          </label>
        </div>
        <p class="muted">
          地点始终写入当前打开的 `/d/…` 路书（需已登录、且有编辑权限）。
        </p>
      </section>

      <div class="footer">
        <button id="save" class="btn primary">保存</button>
        <button id="reset" class="btn">恢复默认</button>
        <span id="saveResult" class="result"></span>
      </div>
    </main>
    <script src="options.js" type="module"></script>
  </body>
</html>
