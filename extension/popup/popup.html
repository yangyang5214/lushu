<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>路书助手</title>
    <style>
      :root {
        --line: #e5e7eb;
        --muted: #6b7280;
        --accent: #e8543f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 300px;
        margin: 0;
        padding: 14px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
        font-size: 13px;
        color: #1f2328;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 15px;
      }
      .status {
        padding: 8px 10px;
        border-radius: 9px;
        background: #f5f6f8;
        color: var(--muted);
        margin-bottom: 10px;
      }
      .status.ok {
        color: #0f7b43;
        background: #eaf7ef;
      }
      .status.err {
        color: #b42318;
        background: #fdecea;
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin: 8px 0 4px;
      }
      input {
        width: 100%;
        padding: 7px 9px;
        font-size: 13px;
        font-family: inherit;
        border: 1px solid var(--line);
        border-radius: 8px;
        outline: none;
      }
      input:focus {
        border-color: var(--accent);
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      button {
        flex: 1;
        padding: 8px 10px;
        font-size: 13px;
        font-family: inherit;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
      }
      button.primary {
        color: #fff;
        background: var(--accent);
        border-color: var(--accent);
        font-weight: 600;
      }
      .hint {
        margin-top: 10px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <h1>路书助手</h1>
    <div id="status" class="status">检查中…</div>

    <label for="key">DeepSeek API Key</label>
    <input id="key" type="password" placeholder="sk-..." autocomplete="off" />

    <div class="actions">
      <button id="saveKey" class="primary">保存 Key</button>
      <button id="settings">全部设置</button>
    </div>
    <div class="actions">
      <button id="openPanel">打开路书面板</button>
      <button id="openLushu">去路书首页</button>
    </div>

    <p class="hint">
      在 <code>lushu.fittools.cc/d/…</code> 页面点右下角「路」按钮，输入主题即可自动生成路书。
    </p>

    <script src="popup.js" type="module"></script>
  </body>
</html>
