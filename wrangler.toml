name = "lushu"
compatibility_date = "2025-08-01"
pages_build_output_dir = "dist"

# 部署前先建库，把返回的 database_id 填到这里：
#   pnpm wrangler d1 create lushu
#
# database_id 不是密钥：它只是账号内的一个标识，没有你的账号凭证无法访问。
# 开源仓库里提交它是正常做法。
[[d1_databases]]
binding = "DB"
database_name = "lushu"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
# 全局路书名额上限；0 表示不限。软上限，防止公开端点被刷满 D1 的 5 GB。
MAX_BOOKS = "20000"
# 单本路书 JSON 上限（字节）。300 个地点约 33 KB。
MAX_DOC_BYTES = "262144"

# 不要在这里放任何密钥。Turnstile 的 secret 用：
#   pnpm wrangler pages secret put TURNSTILE_SECRET
# 本地调试用 .dev.vars（已在 .gitignore 里）。
